<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <nav class="navbar lg:navbar-expand bg-1 fg-2">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Coffee.Shop</a>
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarNavMenu"
          aria-controls="navbarNavMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavMenu" aria-labelledby="navbarNavMenuLabel">
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavMenuLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="nav nav-pills">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="pricing.html">Pricing</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="contact.html">Contact Us</a>
              </li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>

    <div class="container mt-3">
      <form style="max-width: 900px" class="mx-auto">
        <div class="row g-4">
          <div class="md:col-6">
            <div class="form-field">
              <label for="firstName" class="form-label">First name</label>
              <input type="text" class="form-control" id="firstName" />
            </div>
          </div>
          <div class="md:col-6">
            <div class="form-field">
              <label for="lastName" class="form-label">First name</label>
              <input type="text" class="form-control" id="lastName" />
            </div>
          </div>
          <div class="md:col-6">
            <div class="form-field">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" />
            </div>
          </div>
          <div class="md:col-6">
            <div class="form-field">
              <label for="queryType" class="form-label">Query type</label>
              <select class="form-control" id="queryType">
                <option selected>Choose one…</option>
                <option value="1">Bad service</option>
                <option value="2">Bad coffee</option>
                <option value="3">Other</option>
              </select>
            </div>
          </div>
          <div class="form-field">
            <label for="fieldTextarea" class="form-label">Message</label>
            <textarea class="form-control" id="fieldTextarea" rows="3"></textarea>
            <div class="form-text">Be sure to include relevant details.</div>
          </div>
          <div class="form-field">
            <input type="checkbox" id="fieldCheck" class="check" />
            <label for="fieldCheck">I agree to be contacted</label>
          </div>
        </div>
        <button class="btn-solid theme-primary mt-5">Contact Us</button>
      </form>
    </div>

    <footer>
      <div>(c) 2026 My Cool Coffee Shop</div>
      <div>Lab 06</div>
    </footer>
  </body>
</html>
